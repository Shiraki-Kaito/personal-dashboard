<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>個人ダッシュボード</title>
    <link rel="stylesheet" href="/style.css" />
    <script type="module" src="/ui.js"></script>
    <script type="module" src="/drive-ui.js"></script>
  </head>
  <body>
    <main>
      <header>
        <b>個人ダッシュボード</b>
        <form action="/auth/logout" method="post">
          <button>ログアウト</button>
        </form>
      </header>
      <h1>ホーム</h1>
      <section aria-labelledby="driveHeading">
        <h2 id="driveHeading">Drive ／ 過去12時間の更新</h2>
        <p id="driveStatus" role="status">接続状態を確認中</p>
        <p id="driveTimes"></p>
        <p id="driveScope"></p>
        <p id="driveNotice"></p>
        <button id="driveRefresh" disabled>Driveから取得</button>
        <a id="driveFolder" hidden target="_blank" rel="noreferrer"
          >対象フォルダを開く ↗</a
        >
        <form
          id="driveConnect"
          action="/auth/google/start"
          method="post"
          hidden
        >
          <p>
            Google
            Drive全体のメタデータ閲覧を認可します。アプリは設定したフォルダの範囲を取得します。
          </p>
          <button>Google Driveへ接続・再接続</button>
        </form>
        <p id="driveCount"></p>
        <div id="driveFiles"></div>
      </section>
      <h2>GitHub Projects</h2>
      <label
        >Project
        <select id="project"></select
      ></label>
      <p id="mode"></p>
      <section>
        <h2>タスク一覧</h2>
        <button id="refreshList">一覧を更新</button>
        <a id="projectLink" rel="noreferrer">Projectを開く ↗</a>
        <p id="listStatus" role="status"></p>
        <p id="listCount"></p>
        <div id="tasks"></div>
      </section>
      <section id="taskDetails" hidden>
        <h2>同期状況</h2>
        <strong id="phase">読み込み中</strong>
        <p role="alert" id="error"></p>
        <p id="times"></p>
        <p id="age"></p>
        <button id="refresh">GitHubから取得</button>
        <a id="source" rel="noreferrer">Projectを開く ↗</a>
      </section>
      <section id="taskEditor" hidden>
        <h2>選択したタスク</h2>
        <p id="count"></p>
        <h3 id="title">未取得</h3>
        <label
          >状態
          <select id="status"></select></label
        ><button id="saveStatus">状態を反映</button>
        <label>期限 <input id="due" type="date" /></label
        ><button id="saveDue">期限を反映</button>
        <p>期限を空にして反映すると解除できます。</p>
      </section>
      <section id="changes" hidden>
        <h2>未同期の操作</h2>
        <p id="change"></p>
        <button id="retry">照合して再試行</button>
        <button id="discard">変更を破棄</button>
      </section>
    </main>
  </body>
</html>
